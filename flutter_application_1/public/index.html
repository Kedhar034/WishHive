<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WishHive</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:24px;background:#faf7f0;color:#1d1b16;
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:420px;text-align:center}
h1{font-size:28px;margin:0 0 10px}
p{color:#6b6659;margin:0 0 22px}
.btn{display:inline-block;padding:14px 26px;border-radius:12px;background:#c77a14;
color:#fff;text-decoration:none;font-weight:600}
@media(prefers-color-scheme:dark){
body{background:#14161b;color:#e8eaee}p{color:#aeb5c2}}
</style>
</head>
<body>
<div class="wrap">
  <h1>WishHive</h1>
  <p>Organise and share your wishlists with friends.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.wishhive.app">Get the app</a>
</div>
</body>
</html>
